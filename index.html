<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ビフォアアフター撮影</title>
<style>
:root{--bg:#111;--fg:#fff;--accent:#ff9f1c;--pane:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.panes{flex:1;display:flex;gap:2px;min-height:0}
.pane{flex:1;position:relative;overflow:hidden;background:var(--pane);min-width:0}
.pane img,.pane video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/*mini*/.mini{position:absolute;top:6px;right:6px;z-index:3;display:flex;gap:6px}.mini button{padding:5px 9px;font-size:12px;background:rgba(0,0,0,.6)}
#ov{opacity:0;pointer-events:none}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:12px;font-size:12px;z-index:2}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:14px;color:#aaa;z-index:1}
.bar{display:flex;align-items:center;justify-content:space-around;padding:12px 8px;background:#000}
button,label.btn{background:#2a2a2a;color:var(--fg);border:0;border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit}
button.on{background:var(--accent);color:#000}
#shot{width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid #888;padding:0}
#shot:active{background:var(--accent)}
.slider{display:none;padding:6px 16px;background:#000;align-items:center;gap:10px;font-size:12px}
.slider.show{display:flex}
.slider input{flex:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:10;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#modal.show{display:flex}
#modal img{max-width:100%;max-height:68%;border-radius:6px}
#modal p{margin:0;font-size:12px;color:#aaa}
#err{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:#b00020;padding:10px;border-radius:8px;font-size:13px;display:none;z-index:20}
@media (orientation:landscape){
  body{flex-direction:row}
  .bar{flex-direction:column;padding:8px 10px;padding-right:calc(10px + env(safe-area-inset-right,0px));gap:8px}
  .slider{position:fixed;left:12px;bottom:12px;right:140px;border-radius:10px;background:rgba(0,0,0,.7)}
  #modal img{max-height:60%}
}
</style>
</head>
<body>
<div class="panes">
  <div class="pane">
    <span class="tag">ビフォア</span>
    <div class="mini" id="mini" style="display:none"><button id="bSave">保存</button><button id="bClear">消去</button></div>
    <div class="hint" id="hint">シャッターでビフォアを撮影<br>または「写真を選ぶ」で読み込み</div>
    <img id="before" alt="">
  </div>
  <div class="pane">
    <span class="tag">アフター</span>
    <video id="cam" autoplay playsinline muted></video>
    <img id="ov" alt="">
  </div>
</div>
<div class="slider" id="sl"><span>重ね具合</span><input type="range" id="op" min="0" max="100" value="40"></div>
<div class="bar">
  <label class="btn">写真を選ぶ<input type="file" id="file" accept="image/*" hidden></label>
  <button id="ovBtn">重ねる</button>
  <button id="shot" aria-label="撮影"></button>
  <button id="flip">反転</button>
</div>
<div id="modal">
  <img id="result" alt="">
  <div style="display:flex;gap:8px">
    <button id="tBoth" class="on">並べた画像</button>
    <button id="tAfter">アフターのみ</button>
  </div>
  <div style="display:flex;gap:10px">
    <button id="save">保存</button>
    <button id="share">共有</button>
    <button id="close">閉じる</button>
  </div>
</div>
<div id="err"></div>
<script>
const $=id=>document.getElementById(id);
const cam=$('cam'),before=$('before'),ov=$('ov');
let stream=null,facing='environment',ratio=null,blob=null,blobs={},cur='both';

function showErr(m,ok){const e=$('err');e.textContent=m;e.style.background=ok?'#2e7d32':'#b00020';e.style.display='block';setTimeout(()=>e.style.display='none',ok?2500:6000)}

async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const v={facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}};
  if(ratio)v.aspectRatio={ideal:ratio};
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:v,audio:false});
    cam.srcObject=stream;
  }catch(e){
    showErr('カメラを起動できません。ブラウザのサイト設定でカメラを許可してください。');
  }
}

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ba',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(v){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,'before')}catch(e){}}
async function idbGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('k').objectStore('k').get('before');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbDel(){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').delete('before')}catch(e){}}

function dl(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function stamp(){const t=new Date(),p=n=>String(n).padStart(2,'0');return t.getFullYear()+p(t.getMonth()+1)+p(t.getDate())+'-'+p(t.getHours())+p(t.getMinutes())+p(t.getSeconds())}

let beforeBlob=null;
function setBefore(b,persist,fromCam){
  beforeBlob=b;
  const url=URL.createObjectURL(b);
  const im=new Image();
  im.onload=()=>{
    before.src=url;ov.src=url;$('hint').style.display='none';$('mini').style.display='flex';
    ratio=im.naturalWidth/im.naturalHeight;
    if(!fromCam)startCam();
  };
  im.src=url;
  if(persist)idbSet(b);
}

function captureBefore(){
  const c=document.createElement('canvas');
  c.width=cam.videoWidth;c.height=cam.videoHeight;
  c.getContext('2d').drawImage(cam,0,0);
  c.toBlob(b=>{setBefore(b,true,true);showErr('ビフォア写真をセットしました（アプリに記憶されます）',true)},'image/jpeg',.95);
}

$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  setBefore(f,true,false);
});
$('bSave').onclick=()=>{if(beforeBlob)dl(beforeBlob,'before_'+stamp()+'.jpg')};
$('bClear').onclick=()=>{
  if(!confirm('ビフォア写真を消去しますか？'))return;
  beforeBlob=null;before.removeAttribute('src');ov.removeAttribute('src');
  $('hint').style.display='flex';$('mini').style.display='none';
  ratio=null;idbDel();startCam();
};

$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};

let overlayOn=false;
$('ovBtn').onclick=()=>{
  overlayOn=!overlayOn;
  $('ovBtn').classList.toggle('on',overlayOn);
  $('sl').classList.toggle('show',overlayOn);
  ov.style.opacity=overlayOn?$('op').value/100:0;
};
$('op').oninput=e=>{if(overlayOn)ov.style.opacity=e.target.value/100};

$('shot').onclick=()=>{
  if(!cam.videoWidth){showErr('カメラが準備できていません');return}
  if(!before.getAttribute('src')){captureBefore();return}
  const h=Math.min(before.naturalHeight,1600);
  const bw=before.naturalWidth*h/before.naturalHeight;
  const aw=cam.videoWidth*h/cam.videoHeight;
  const c=document.createElement('canvas');
  c.width=Math.round(bw+aw+8);c.height=h;
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.drawImage(before,0,0,bw,h);
  g.drawImage(cam,bw+8,0,aw,h);
  const c2=document.createElement('canvas');
  c2.width=cam.videoWidth;c2.height=cam.videoHeight;
  c2.getContext('2d').drawImage(cam,0,0);
  c.toBlob(b1=>{
    c2.toBlob(b2=>{
      blobs={both:b1,after:b2};
      show('both');
      $('modal').classList.add('show');
    },'image/jpeg',.95);
  },'image/jpeg',.92);
};

function show(k){
  cur=k;blob=blobs[k];
  $('result').src=URL.createObjectURL(blob);
  $('tBoth').classList.toggle('on',k==='both');
  $('tAfter').classList.toggle('on',k==='after');
}
$('tBoth').onclick=()=>show('both');
$('tAfter').onclick=()=>show('after');
$('save').onclick=()=>{
  if(!blob)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const t=new Date(),p=n=>String(n).padStart(2,'0');
  a.download=(cur==='after'?'after_':'before-after_')+t.getFullYear()+p(t.getMonth()+1)+p(t.getDate())+'-'+p(t.getHours())+p(t.getMinutes())+p(t.getSeconds())+'.jpg';
  document.body.appendChild(a);a.click();a.remove();
};

$('close').onclick=()=>$('modal').classList.remove('show');
$('share').onclick=async()=>{
  if(!blob)return;
  const file=new File([blob],(cur==='after'?'after.jpg':'before-after.jpg'),{type:'image/jpeg'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}
    else showErr('共有に対応していません。画像を長押しして保存してください');
  }catch(e){}
};

try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
idbGet().then(b=>{if(b)setBefore(b,false,false);else startCam()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
